name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - name: Build universal app + DMG
        run: UNIVERSAL=1 DMG=1 bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang cmake libssl-dev libzstd-dev libasound2-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build .deb + AppImage
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/*.deb
            target/release/*.AppImage

  release:
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release (notes = annotated tag message)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" dist/* --title "JInk $TAG" --notes-from-tag --verify-tag \
            || gh release upload "$TAG" dist/* --clobber
